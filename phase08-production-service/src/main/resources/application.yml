server:
  port: 8080

agent:
  triage:
    enabled: true
    model-name: "gpt-4o"
    max-iterations: 5
    token-budget: 4000
    temperature: 0.2
    p95-floor-ms: 25.0
    rps-floor: 15.0

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
